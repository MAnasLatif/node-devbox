name: Feature request
description: Propose an improvement backed by a concrete development workflow
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Explain the developer problem before proposing an implementation. Focused additions that preserve isolation and keep the CLI predictable are easiest to evaluate.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult or impossible today, and who experiences it?
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Current workflow
      description: Show the commands or steps currently required.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the user-facing result, including a CLI example when relevant.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What existing options or workarounds did you try?
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Compatibility and security impact
      description: Note changes to generated files, volumes, credentials, ports, supported hosts, or existing commands.
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues and requests.
          required: true
        - label: This request is within Node Devbox's development-environment scope.
          required: true
        - label: I have not included credentials or private information.
          required: true
