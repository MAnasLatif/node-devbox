name: Publish npm package

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify release version
        run: |
          package_version="$(node --input-type=module -e "import packageJson from './package.json' with { type: 'json' }; process.stdout.write(packageJson.version)")"
          test "v${package_version}" = "${GITHUB_REF_NAME}"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check package version
        id: package
        run: |
          package_version="$(node --input-type=module -e "import packageJson from './package.json' with { type: 'json' }; process.stdout.write(packageJson.version)")"
          if npm view "node-devbox@${package_version}" version >/dev/null 2>&1; then
            echo "publish=false" >> "${GITHUB_OUTPUT}"
          else
            echo "publish=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish package
        if: steps.package.outputs.publish == 'true'
        run: npm publish --access public --provenance