name: Documentation improvement
description: Report missing, incorrect, or unclear documentation
title: "[Docs]: "
labels:
  - documentation
body:
  - type: input
    id: location
    attributes:
      label: Documentation location
      description: Link to the section or name the file and heading.
      placeholder: "README.md > Workspace storage"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is incorrect, missing, ambiguous, or difficult to follow?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
      description: Describe the wording, example, or structure that would help.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I checked the latest version of the documentation.
          required: true
        - label: I removed credentials and private information from examples.
          required: true
